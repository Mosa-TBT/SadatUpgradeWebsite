# Deploy: SadaatUpgrade.com — Vite (React) SPA pipeline

name: CI / CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: sadatupgrade-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  DEPLOY_PATH: /var/www/sadat-upgrade
  DEPLOY_PORT: "22"
  DOMAIN: SadaatUpgrade.com
  # Public ed25519 host key of the VPS. Host-key verification is enabled and
  # pinned — we never disable StrictHostKeyChecking.
  HOST_KEY: "145.79.8.231 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIkFZyNI5fKXpJ75KI2Dd+zSsHE7DR/dkoPeJGqLh/Pd"

jobs:
  ci:
    name: CI (install + lint + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version is read from the "packageManager" field in package.json
      # (currently pnpm@11.22.0) — no hard-coded version, no drift.
      - name: Setup pnpm (version pinned in package.json)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build (Vite)
        run: pnpm build

      - name: Verify static output
        run: test -f dist/index.html && echo "dist/index.html OK"

      # Hand the exact CI-built bundle to the deploy job.
      - name: Upload built dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to production
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Unique per attempt: run_number + run_attempt + sha.
      TS: ${{ github.run_number }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - name: Download built dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Package built dist (dist only)
        run: |
          mkdir -p .deploy-artifacts
          tar --warning=no-file-changed --ignore-failed-read \
            -czf ".deploy-artifacts/sadat-web-${{ env.TS }}-dist.tar.gz" -C dist .
          ls -lh .deploy-artifacts/

      - name: Configure SSH (pin host key)
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          echo "$HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Install deploy key (decode Base64 + validate, fail fast)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          key=$(printf '%s' "$DEPLOY_SSH_KEY")
          key=$(printf '%s' "$key" | sed -e 's/\\n/\n/g' -e 's/\r$//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [[ "$key" == \"*\" ]] || [[ "$key" == \'*\' ]]; then
            key="${key:1:${#key}-2}"
          fi
          echo "$key" | base64 --decode > "$HOME/.ssh/sadat_deploy" 2>/dev/null || \
            { printf '%s\n' "$key" > "$HOME/.ssh/sadat_deploy"; }
          chmod 600 "$HOME/.ssh/sadat_deploy"
          if ! ssh-keygen -y -f "$HOME/.ssh/sadat_deploy" >/dev/null 2>&1; then
            echo "::error title=Deploy key::DEPLOY_SSH_KEY is not a valid private key (PEM/OpenSSH block)."
            exit 1
          fi
          echo "deploy key OK"

      - name: Upload dist to release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/sadat_deploy" -P "$DEPLOY_PORT" \
              ".deploy-artifacts/sadat-web-${{ env.TS }}-dist.tar.gz" \
              "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/sadat-web-${{ env.TS }}-dist.tar.gz"

      - name: Remote deploy (validate + atomic switch, no build)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/sadat_deploy" -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "if [ -x \"$DEPLOY_PATH/deploy/bin/deploy-web-dist.sh\" ]; then \"$DEPLOY_PATH/deploy/bin/deploy-web-dist.sh\" \"${{ env.TS }}\"; else echo '::error title=Vite deploy::deploy-web-dist.sh is not installed on the server (repo deploy/bin/deploy-web-dist.sh).'; exit 1; fi"

      - name: Health check (public HTTPS + exact asset)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          js="$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)"
          test -n "$js" || { echo "::error title=Health check::could not determine bundle name from dist/index.html"; exit 1; }
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/sadat_deploy" -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "curl -fsS -o /dev/null https://$DOMAIN/ && curl -fsS -o /dev/null https://$DOMAIN/$js && echo 'HTTPS + asset OK'"

      - name: Report rollback status
        if: failure()
        run: echo "Deployment of ${{ env.TS }} failed; current-web was left on the previous release (the server script never activates on failure)."
