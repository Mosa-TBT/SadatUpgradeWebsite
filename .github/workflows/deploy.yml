# Deploy: SadaatUpgrade.com — Vite (React) SPA pipeline

name: CI / CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: sadatupgrade-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.22.0"
  DEPLOY_PATH: /var/www/sadat-upgrade
  DEPLOY_PORT: "22"
  DOMAIN: SadaatUpgrade.com
  # Public ed25519 host key of the VPS. Host-key verification is enabled and
  # pinned — we never disable StrictHostKeyChecking.
  HOST_KEY: "145.79.8.231 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIkFZyNI5fKXpJ75KI2Dd+zSsHE7DR/dkoPeJGqLh/Pd"

jobs:
  ci:
    name: CI (install + lint + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build (Vite)
        run: pnpm build

      - name: Verify static output
        run: test -f dist/index.html && echo "dist/index.html OK"

  deploy:
    name: Deploy to production
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TS: ${{ github.run_number }}-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare source tarball (no node_modules / dist / .git)
        run: |
          mkdir -p .deploy-artifacts
          tar --warning=no-file-changed --ignore-failed-read \
            --exclude=node_modules --exclude=dist --exclude=.git \
            --exclude=.deploy-artifacts \
            -czf ".deploy-artifacts/sadat-web-${{ env.TS }}.tar.gz" .
          ls -lh .deploy-artifacts/

      - name: Configure SSH (pin host key)
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          echo "$HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Install deploy key (decode Base64 + validate, fail fast)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          key=$(printf '%s' "$DEPLOY_SSH_KEY")
          key=$(printf '%s' "$key" | sed -e 's/\\n/\n/g' -e 's/\r$//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [[ "$key" == \"*\" ]] || [[ "$key" == \'*\' ]]; then
            key="${key:1:${#key}-2}"
          fi
          echo "$key" | base64 --decode > "$HOME/.ssh/sadat_deploy" 2>/dev/null || \
            { printf '%s\n' "$key" > "$HOME/.ssh/sadat_deploy"; }
          chmod 600 "$HOME/.ssh/sadat_deploy"
          if ! ssh-keygen -y -f "$HOME/.ssh/sadat_deploy" >/dev/null 2>&1; then
            echo "::error title=Deploy key::DEPLOY_SSH_KEY is not a valid private key (PEM/OpenSSH block)."
            exit 1
          fi
          echo "deploy key OK"

      - name: Upload release source
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/sadat_deploy" -P "$DEPLOY_PORT" \
              ".deploy-artifacts/sadat-web-${{ env.TS }}.tar.gz" \
              "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/sadat-web-${{ env.TS }}.tar.gz"

      - name: Remote deploy (install, build, atomic switch, health check)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/sadat_deploy" -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "if [ -x \"$DEPLOY_PATH/deploy/bin/deploy-vite.sh\" ]; then \"$DEPLOY_PATH/deploy/bin/deploy-vite.sh\" \"${{ env.TS }}\"; else echo '::error title=Vite deploy::deploy-vite.sh is not installed on the server. Deploy the server-side script (repo deploy/bin/deploy-vite.sh) first.'; exit 1; fi"

      - name: Health check (public HTTPS)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/sadat_deploy" -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "curl -fsS -o /dev/null https://$DOMAIN/ && echo 'HTTPS OK'"

      - name: Report rollback status
        if: failure()
        run: echo "Deployment of ${{ env.TS }} failed; previous web release is preserved by the remote script's rollback."