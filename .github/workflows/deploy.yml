
# Deploy: SadaatUpgrade.com — production pipeline

name: CI / CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: sadatupgrade-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  DEPLOY_PATH: /var/www/sadat-upgrade
  DEPLOY_PORT: "22"
  DOMAIN: SadaatUpgrade.com

  # Public ed25519 host key of the VPS (145.79.8.231).
  # Host-key verification remains enabled.
  HOST_KEY: "145.79.8.231 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIkFZyNI5fKXpJ75KI2Dd+zSsHE7DR/dkoPeJGqLh/Pd"

jobs:
  ci:
    name: CI (lint + build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to production
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TS: ${{ github.run_number }}-${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare source tarball (no node_modules / .next / .git)
        run: |
          set -euo pipefail

          mkdir -p .deploy-artifacts

          tar --warning=no-file-changed --ignore-failed-read \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=.git \
            --exclude=backend/vendor \
            --exclude=backend/storage \
            --exclude=.deploy-artifacts \
            -czf ".deploy-artifacts/sadat-src-${TS}.tar.gz" .

          ls -lh .deploy-artifacts/

      # SSH configuration: pinned host key, strict verification.
      - name: Configure SSH (pin host key)
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      # DEPLOY_SSH_KEY must contain the Base64-encoded
      # bytes of the existing OpenSSH private key.
      - name: Install deploy key (decode Base64 + validate)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${DEPLOY_SSH_KEY:-}" ]]; then
            echo "::error title=Deploy key::DEPLOY_SSH_KEY secret is empty or unavailable."
            exit 1
          fi

          printf '%s' "$DEPLOY_SSH_KEY" \
            | tr -d '[:space:]' \
            | base64 --decode > "$HOME/.ssh/sadat_deploy"

          chmod 600 "$HOME/.ssh/sadat_deploy"

          if ! ssh-keygen -y -f "$HOME/.ssh/sadat_deploy" >/dev/null 2>&1; then
            rm -f "$HOME/.ssh/sadat_deploy"
            echo "::error title=Deploy key::Decoded DEPLOY_SSH_KEY is not a valid private key."
            exit 1
          fi

          echo "deploy key OK"

      - name: Upload release source
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          scp -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/sadat_deploy" \
              -P "$DEPLOY_PORT" \
              ".deploy-artifacts/sadat-src-${TS}.tar.gz" \
              "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/sadat-src-${TS}.tar.gz"

      - name: Remote deploy (build release, switch current, restart, health check)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          ssh -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/sadat_deploy" \
              -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "\"$DEPLOY_PATH/deploy/bin/deploy.sh\" \"$TS\""

      - name: Health check (public HTTPS)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          ssh -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/sadat_deploy" \
              -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "$DEPLOY_PATH/deploy/bin/healthcheck.sh https://$DOMAIN/"

      - name: Rollback on failure
        if: failure()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          ssh -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/sadat_deploy" \
              -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "$DEPLOY_PATH/deploy/bin/rollback.sh https://$DOMAIN/"

          echo "Deployment of $TS failed; previous release restored."
