<VirtualHost *:80>
    ServerName SadaatUpgrade.com
    ServerAlias www.SadaatUpgrade.com
    ServerAdmin webmaster@SadaatUpgrade.com

    # ACME/Let's Encrypt challenge path (served statically, before redirect).
    Alias /.well-known/acme-challenge /var/www/sadat-upgrade/shared/acme-challenge
    <Directory /var/www/sadat-upgrade/shared/acme-challenge>
        Require all granted
    </Directory>

    # Redirect everything else to HTTPS.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/sadaatupgrade_error.log
    CustomLog ${APACHE_LOG_DIR}/sadaatupgrade_access.log combined

    # Security headers (safe baseline; Next.js adds its own headers via middleware/headers config).
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
</VirtualHost>