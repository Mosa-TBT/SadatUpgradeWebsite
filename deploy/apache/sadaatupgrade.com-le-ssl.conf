<VirtualHost *:443>
    ServerName SadaatUpgrade.com
    ServerAlias www.SadaatUpgrade.com
    ServerAdmin webmaster@SadaatUpgrade.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/SadaatUpgrade.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/SadaatUpgrade.com/privkey.pem

    # Reverse proxy: Apache (443) -> Next.js in production mode.
    # The Next.js app is the frontend; it owns static assets and SSR.
    ProxyPreserveHost On
    ProxyRequests Off

    # Optional Laravel backend (api + storage + sanctum). Remove these three
    # <Location> blocks if the repo does not ship/use backend/.
    <Location /api>
        Require all granted
        ProxyPass http://127.0.0.1:8009/api
        ProxyPassReverse http://127.0.0.1:8009/api
    </Location>
    <Location /storage>
        Require all granted
        ProxyPass http://127.0.0.1:8009/storage
        ProxyPassReverse http://127.0.0.1:8009/storage
    </Location>
    <Location /sanctum>
        Require all granted
        ProxyPass http://127.0.0.1:8009/sanctum
        ProxyPassReverse http://127.0.0.1:8009/sanctum
    </Location>

    ProxyPass / http://127.0.0.1:3180/
    ProxyPassReverse / http://127.0.0.1:3180/

    # Compression for proxied text content Apache writes itself (Next.js
    # already sends gzip for its own responses, so this only helps otherwise).
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml
    AddOutputFilterByType DEFLATE application/javascript application/json

    ErrorLog ${APACHE_LOG_DIR}/sadaatupgrade_error.log
    CustomLog ${APACHE_LOG_DIR}/sadaatupgrade_access.log combined

    # Security headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set X-Frame-Options "SAMEORIGIN"
</VirtualHost>